  .oa-empty-state { max-width: 640px; margin: 48px auto; text-align: center;

  .oa-empty-icon { font-size: 44px; margin-bottom: 12px; }

  .oa-empty-note { font-size: 12px !important; color: var(--oa-tertiary, #98989d) !important; }
  .oa-empty-note code { background: var(--oa-surface-3, #f5f5f7); padding: 1px 6px; border-radius: 6px; }
  .oa-page-head { text-align: center; margin: 32px 0 0; }
  .oa-page-head h1 { font-size: 22px; color: var(--oa-text, #1c1c1e); }

<body class="oa-page">
<div class="oa-content-wrap">
  <header class="oa-page-head">
    <h1>📦 补货跟进</h1>
    <p class="oa-page-sub">Amazon-FR 站 · 独立数据源（不与 UK 通用）</p>
  </header>

  <section class="oa-empty-state" data-restock-status="empty" role="status">
    <div class="oa-empty-icon">🗂️</div>

    <p>法国站补货跟进使用独立的 FR 库存数据源，UK 站补货数据已于 2026-08-29 清除、不再通用。</p>
    <p>接入 FR 库存数据源（卖家平台导出 / 库存 API）后，本板块将展示 FR 站 SKU 的
       补货告警、可售天数与补货建议。</p>
    <p class="oa-empty-note">接入方式与字段规范参见仓库内 <code>generate_analysis.py</code> 与
       <code>DEPLOY-CHECKLIST.md</code>。</p>
